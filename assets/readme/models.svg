<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Сравнение моделей на демо-сценариях</title>
  <desc id="desc">Итоговая оценка на 9 образцах, среднее по 3 прогонам, и среднее время проверки одного документа: qwen3:14b 99% и 6,4 с; gemma3:12b 98% и 5,4 с; qwen3:8b 97% и 3,9 с; T-lite-it-2.1 96% и 3,0 с; qwen3.5:9b 95% и 3,6 с; qwen3:1.7b 76% и 1,3 с; YandexGPT-5-Lite-8B 74% и 3,3 с. Рекомендованы qwen3:14b и qwen3:8b.</desc>

  <rect width="1200" height="520" rx="24" fill="#F4F6F9"/>

  <g font-family="'Golos Text', 'Segoe UI', -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="48" y="62" font-size="28" font-weight="700" fill="#1B2B4B">Качество на 9 образцах, среднее по 3 прогонам</text>
    <text x="48" y="94" font-size="18" fill="#5B6577">RTX 5070 Ti 16 ГБ, Ollama, Q4_K_M, режим рассуждений выключен</text>
    <text x="1152" y="94" font-size="18" fill="#5B6577" text-anchor="end">проверка документа, с</text>

    <!-- шкала: 0% = x 360, 100% = x 960 -->
    <g fill="#D3DAE3">
      <rect x="360" y="116" width="1" height="358"/>
      <rect x="660" y="116" width="1" height="358"/>
      <rect x="960" y="116" width="1" height="358"/>
    </g>
    <g font-size="16" fill="#8A94A6" text-anchor="middle">
      <text x="360" y="496">0%</text>
      <text x="660" y="496">50%</text>
      <text x="960" y="496">100%</text>
    </g>

    <g font-size="21">
      <g transform="translate(0 124)">
        <text x="48" y="22" font-weight="700" fill="#1B2B4B">qwen3:14b</text>
        <rect x="360" y="2" width="594" height="28" rx="4" fill="#2A4FA8"/>
        <text x="944" y="23" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="end">99%</text>
        <text x="1152" y="22" fill="#1B2B4B" text-anchor="end">6,4</text>
      </g>
      <g transform="translate(0 174)">
        <text x="48" y="22" fill="#3A475E">gemma3:12b</text>
        <rect x="360" y="2" width="588" height="28" rx="4" fill="#9AA6B8"/>
        <text x="938" y="23" font-size="18" fill="#FFFFFF" text-anchor="end">98%</text>
        <text x="1152" y="22" fill="#3A475E" text-anchor="end">5,4</text>
      </g>
      <g transform="translate(0 224)">
        <text x="48" y="22" font-weight="700" fill="#1B2B4B">qwen3:8b</text>
        <rect x="360" y="2" width="582" height="28" rx="4" fill="#2A4FA8"/>
        <text x="932" y="23" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="end">97%</text>
        <text x="1152" y="22" fill="#1B2B4B" text-anchor="end">3,9</text>
      </g>
      <g transform="translate(0 274)">
        <text x="48" y="22" fill="#3A475E">T-lite-it-2.1</text>
        <rect x="360" y="2" width="576" height="28" rx="4" fill="#9AA6B8"/>
        <text x="926" y="23" font-size="18" fill="#FFFFFF" text-anchor="end">96%</text>
        <text x="1152" y="22" fill="#3A475E" text-anchor="end">3,0</text>
      </g>
      <g transform="translate(0 324)">
        <text x="48" y="22" fill="#3A475E">qwen3.5:9b</text>
        <rect x="360" y="2" width="570" height="28" rx="4" fill="#9AA6B8"/>
        <text x="920" y="23" font-size="18" fill="#FFFFFF" text-anchor="end">95%</text>
        <text x="1152" y="22" fill="#3A475E" text-anchor="end">3,6</text>
      </g>
      <g transform="translate(0 374)">
        <text x="48" y="22" fill="#3A475E">qwen3:1.7b</text>
        <rect x="360" y="2" width="456" height="28" rx="4" fill="#C9D1DC"/>
        <text x="806" y="23" font-size="18" fill="#3A475E" text-anchor="end">76%</text>
        <text x="1152" y="22" fill="#3A475E" text-anchor="end">1,3</text>
      </g>
      <g transform="translate(0 424)">
        <text x="48" y="22" fill="#3A475E">YandexGPT-5-Lite-8B</text>
        <rect x="360" y="2" width="444" height="28" rx="4" fill="#C9D1DC"/>
        <text x="794" y="23" font-size="18" fill="#3A475E" text-anchor="end">74%</text>
        <text x="1152" y="22" fill="#3A475E" text-anchor="end">3,3</text>
      </g>
    </g>
  </g>
</svg>
