# Запуск: make up-local (сборка из исходников) или make up-prod (образы из GHCR).
name: gosdoc

# Общие ограничения: процесс не может повысить привилегии (setuid и т. п.).
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gosdoc}
      POSTGRES_USER: ${POSTGRES_USER:-gosdoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    <<: *hardening
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped

  backend:
    image: ${IMAGE_PREFIX:-ghcr.io/fgeeha/light-gosdoc-assistant}-backend:${TAG:-latest}
    build: ../backend
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gosdoc}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-gosdoc}
    depends_on:
      db:
        condition: service_healthy
    # Доступ к Ollama/vLLM, запущенным на хосте: LLM_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Порт бэкенда наружу не публикуется: uvicorn доверяет X-Forwarded-For от любого адреса
    # (--forwarded-allow-ips "*"), что безопасно, только пока до него доходит лишь nginx.
    <<: *hardening
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]  # временные файлы загрузок (python-multipart)
    deploy:
      resources:
        limits:
          memory: 2g  # разбор PDF/DOCX; потолок не даёт «бомбе» уронить хост
    restart: unless-stopped

  frontend:
    image: ${IMAGE_PREFIX:-ghcr.io/fgeeha/light-gosdoc-assistant}-frontend:${TAG:-latest}
    build: ../frontend
    environment:
      # Адрес/подсеть внешнего обратного прокси, которому nginx доверяет X-Forwarded-For.
      TRUSTED_PROXY: ${TRUSTED_PROXY:-127.0.0.1}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      - backend
    <<: *hardening
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /etc/nginx/conf.d:mode=1777  # сюда envsubst пишет конфиг из шаблона
    deploy:
      resources:
        limits:
          memory: 256m
    restart: unless-stopped

  # Модель в контейнере на GPU: COMPOSE_PROFILES=ollama и LLM_BASE_URL=http://ollama:11434/v1
  ollama:
    image: ollama/ollama:0.31.2
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_CONTEXT_LENGTH: "16384"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
